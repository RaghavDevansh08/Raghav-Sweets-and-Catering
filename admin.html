<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard | Raghav Sweets</title>

    <link rel="stylesheet" href="css/style.css" />

    <style>
      body {
        background: #f5f5f5;
      }

      .admin-container {
        width: min(1100px, 95%);
        margin: 40px auto;
      }

      .admin-title {
        font-size: 32px;
        margin-bottom: 30px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      .card h2 {
        font-size: 18px;
        margin-bottom: 15px;
      }

      .number {
        font-size: 34px;
        font-weight: bold;
        color: #d35400;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 15px;
        overflow: hidden;
      }

      th,
      td {
        padding: 16px;
        border-bottom: 1px solid #eee;
        text-align: left;
      }

      th {
        background: #d35400;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="admin-container">
      <h1 class="admin-title">Raghav Sweets Admin Dashboard</h1>

      <div class="stats">
        <div class="card">
          <h2>Today's Orders</h2>
          <div class="number" id="totalOrders">0</div>
        </div>

        <div class="card">
          <h2>Pending Orders</h2>
          <div class="number" id="pendingOrders">0</div>
        </div>

        <div class="card">
          <h2>Today's Revenue</h2>
          <div class="number" id="revenue">₹0</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Order ID</th>

            <th>Customer</th>

            <th>Phone</th>

            <th>Total</th>

            <th>Status</th>
          </tr>
        </thead>

        <tbody id="ordersTable">
          <tr>
            <td colspan="5">No orders yet</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="js/admin.js"></script>
  </body>
</html>
